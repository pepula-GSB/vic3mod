<!DOCTYPE html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ameryka Północna 1836 – vic3mod</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
:root{--text-primary:#1a1a19;--text-secondary:#5f5e5a;--text-muted:#888780;--surface-1:#fcfcfb;--surface-2:#fff;--border:rgba(11,11,11,.12);--bg-neutral:#e8e6df}
@media (prefers-color-scheme:dark){:root{--text-primary:#f0efec;--text-secondary:#c3c2b7;--text-muted:#898781;--surface-1:#191919;--surface-2:#1f1f1f;--border:rgba(255,255,255,.12);--bg-neutral:#2c2c2a}body{background:#111}}
body{font-family:system-ui,sans-serif;max-width:900px;margin:0 auto;padding:16px;background:#f4f3ef}
button{background:transparent;border:0.5px solid var(--border);border-radius:8px;padding:6px 12px;color:var(--text-primary);font:inherit;cursor:pointer}
</style></head><body>
<h2 class="sr-only">Schematyczna mapa Ameryki Północnej w 1836 roku w alternatywnej historii moda.</h2>
<style>
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.lg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-secondary);cursor:pointer;padding:2px 0}
.lg span.sw{width:10px;height:10px;border-radius:2px;flex:none}
.zb{display:flex;gap:8px;margin:8px 0}
</style>
<div id="info" style="font-size:14px;color:var(--text-primary);min-height:44px;padding:6px 0">Dotknij państwa, żeby zobaczyć nazwę. Mapę można przybliżać palcami.</div>
<div id="map" style="width:100%;border:0.5px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface-1)"></div>
<div class="zb"><button id="zin" aria-label="Przybliż"><i class="ti ti-plus" aria-hidden="true"></i></button><button id="zout" aria-label="Oddal"><i class="ti ti-minus" aria-hidden="true"></i></button><button id="zres">Pokaż całość</button></div>
<div id="legend" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:12px"></div>
<p style="font-size:12px;color:var(--text-muted);margin-top:10px">Granice w USA idą po dzisiejszych stanach, a w Kanadzie i Meksyku są schematyczne.</p>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script>
const S={
LOU:['Republika Luizjany','Luizjana','#c94f7c',[-90,34.5],1,'Republika plantatorów, stolica Nowy Orlean. Od Mobile po Kraj Illinois i Kentucky'],
NFR:['Królestwo Nowej Francji','Nowa Francja','#5b7fc7',[-80,47.5],1,'Burbonowie w Quebecu, Wielkie Jeziora i dolina Ohio'],
DEN:['Nova Dania (Dania-Norwegia)','Nova Dania','#a07cc5',[-100,58],1,'Kompania futrzarska, stolica Munkshavn'],
NOV:['Ameryka Nowogrodzka','Nowogród','#3d8f80',[-152,63],1,'Kompania Nowogrodzko-Amerykańska, Nowy Nowogród na Sitce'],
NEN:['Dominium Nowej Anglii (Anglia)','Nowa Anglia','#d77b7b',[-71.5,44.2],0,'Kongregacjonaliści, kupcy, przędzalnie'],
NNE:['Nowe Niderlandy (Niderlandy)','Nowe Niderlandy','#ef8a3c',[-75.5,41.6],0,'Nowy Amsterdam, najbardziej tolerancyjne'],
VIR:['Dominium Wirginii (Anglia)','Wirginia','#a33a3a',[-79.5,35.8],1,'Plantatorzy, kryzys abolicyjny'],
ENG:['Anglia','Anglia','#c74b4b',[-56,48.8],0,'Nowa Fundlandia, Jamajka, Bahamy, Belize'],
MEX:['Meksyk','Meksyk','#5fae6a',[-104,26],1,'Wielki, ale kruchy: Kalifornia, Teksas, Nowy Meksyk'],
ESP:['Hiszpania','Hiszpania','#e3b85d',[-82,28.6],0,'Floryda, Kuba, Portoryko, Nowa Granada'],
HAI:['Haiti','Haiti','#7a9e9f',[-71.5,19.2],0,'Cała wyspa, schronienie dla zbiegów'],
FAM:['Federacja Ameryki Środkowej','Am. Środkowa','#9ccc7a',[-87,14.5],0,'Wojny liberałów z konserwatystami'],
VEN:['Wenezuela','Wenezuela','#e88f5a',[-66,8],0,''],
HAW:['Królestwo Hawajów','Hawaje','#e0c069',[-157,21],0,'Faktoria nowogrodzka'],
ORE:['Oregon (nieskolonizowany)','Oregon','#c9c3b0',[-121,45.5],0,'Roszczenia czterech państw, furtka do niepodległości'],
NAT:['Ziemie tubylcze (niezależne)','','#ddd8c8',[0,0],0,'Komancze, Siuksowie, Czarne Stopy, Apacze i inni']
};
const ST={Maine:'NEN','New Hampshire':'NEN',Vermont:'NEN',Massachusetts:'NEN','Rhode Island':'NEN',Connecticut:'NEN','New York':'NNE','New Jersey':'NNE',Delaware:'NNE',Pennsylvania:'NNE',Maryland:'VIR',Virginia:'VIR','North Carolina':'VIR','South Carolina':'VIR',Georgia:'VIR','District of Columbia':'VIR','West Virginia':'NFR',Ohio:'NFR',Michigan:'NFR',Indiana:'NFR',Illinois:'LOU',Wisconsin:'NFR',Kentucky:'LOU',Minnesota:'NFR',Missouri:'LOU',Louisiana:'LOU',Arkansas:'LOU',Mississippi:'LOU',Tennessee:'LOU',Alabama:'LOU',Florida:'ESP',Texas:'MEX',California:'MEX',Nevada:'MEX',Utah:'MEX',Arizona:'MEX','New Mexico':'MEX',Washington:'ORE',Oregon:'ORE',Idaho:'ORE',Alaska:'NOV',Hawaii:'HAW','Puerto Rico':'ESP'};
const SP={Pennsylvania:[['NFR',[-81,39,-78.6,43]]],Tennessee:[['NAT',[-85.5,34,-81,37]]],Alabama:[]};
const NFRPOLY=[[-95.15,49.0],[-95.15,52.85],[-89.0,56.9],[-85,55.3],[-82.3,55.1],[-82.0,52.9],[-80.5,51.3],[-79.5,51.5],[-79.5,52.0],[-70,52.0],[-63,52.0],[-57.1,51.45],[-59.6,47.6],[-59.5,45.5],[-66,42],[-100,42],[-100,49]];
const W={'124':['DEN',[['NAT',[[-122.8,48.0],[-114.0,48.0],[-114.1,49.0],[-120.0,53.8],[-122.8,54.0]]],['NOV',[-136,48.2,-122.8,55.2]],['NFR',NFRPOLY],['ENG',[-59.8,46.5,-52.5,51.8]]]],'484':['MEX'],'304':['DEN'],'320':['FAM'],'222':['FAM'],'340':['FAM'],'558':['FAM'],'188':['FAM'],'084':['ENG'],'591':['ESP'],'192':['ESP'],'388':['ENG'],'044':['ENG'],'332':['HAI'],'214':['HAI'],'170':['ESP'],'862':['VEN'],'060':['ENG'],'630':['ESP']};
const G=[['Ameryka Północna',['LOU','NFR','DEN','NOV','NEN','NNE','VIR','ENG','MEX','ORE','NAT']],['Karaiby i południe',['ESP','HAI','FAM','VEN','HAW']]];
const Wd=760,Ht=880;
const svg=d3.select('#map').append('svg').attr('viewBox',`0 0 ${Wd} ${Ht}`).attr('width','100%').style('display','block').style('touch-action','none');
const proj=d3.geoConicEqualArea().parallels([20,60]).rotate([100,0]);
proj.fitExtent([[2,2],[Wd-2,Ht-2]],{type:'MultiPoint',coordinates:[[-168,55],[-140,70],[-60,60],[-52,48],[-60,10],[-90,8],[-120,22],[-100,72]]});
const path=d3.geoPath(proj);
const defs=svg.append('defs');const root=svg.append('g');const gMap=root.append('g');const gLab=root.append('g').style('pointer-events','none');
let cid=0,sel=null,k=1;
function boxPath(b){const p=[];if(Array.isArray(b[0])){for(let i=0;i<b.length;i++){const a=b[i],c=b[(i+1)%b.length];for(let t=0;t<8;t++)p.push([a[0]+(c[0]-a[0])*t/8,a[1]+(c[1]-a[1])*t/8])}}else{const[x0,y0,x1,y1]=b,n=24;for(let i=0;i<=n;i++)p.push([x0+(x1-x0)*i/n,y0]);for(let i=0;i<=n;i++)p.push([x1,y0+(y1-y0)*i/n]);for(let i=0;i<=n;i++)p.push([x1-(x1-x0)*i/n,y1]);for(let i=0;i<=n;i++)p.push([x0,y1-(y1-y0)*i/n])}return 'M'+p.map(q=>proj(q).join(',')).join('L')+'Z'}
function info(key){const el=document.getElementById('info');if(!key||!S[key]){el.innerHTML='Dotknij państwa, żeby zobaczyć nazwę. Mapę można przybliżać palcami.';return}const s=S[key];el.innerHTML=`<span style="font-weight:500">${s[0]}</span>`+(s[5]?`<br><span style="font-size:13px;color:var(--text-secondary)">${s[5]}</span>`:'')}
function pick(key){sel=(sel===key)?null:key;gMap.selectAll('path').style('opacity',d=>(!sel||d===sel)?1:0.3);d3.selectAll('.lg').style('opacity',function(){return(!sel||this.dataset.k===sel)?1:0.45});info(sel)}
function fill(key){return key&&S[key]?S[key][2]:'var(--bg-neutral)'}
function draw(f,key,parts){gMap.append('path').datum(key).attr('d',path(f)).style('fill',fill(key)).style('stroke','var(--surface-1)').style('stroke-width',0.4).on('click',ev=>{ev.stopPropagation();if(key)pick(key)});(parts||[]).forEach(([pk,b])=>{const id='c'+(cid++);defs.append('clipPath').attr('id',id).append('path').attr('d',boxPath(b));gMap.append('path').datum(pk).attr('d',path(f)).attr('clip-path',`url(#${id})`).style('fill',fill(pk)).style('stroke','none').on('click',ev=>{ev.stopPropagation();pick(pk)})})}
Promise.all([d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json'),d3.json('https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json')]).then(([w,us])=>{
topojson.feature(w,w.objects.countries).features.forEach(f=>{if(f.id==='840')return;const r=W[f.id];if(r)draw(f,r[0],r[1]);else draw(f,null)});
topojson.feature(us,us.objects.states).features.forEach(f=>{const n=f.properties.name;draw(f,ST[n]||'NAT',SP[n])});
Object.entries(S).forEach(([key,s])=>{if(!s[1])return;const p=proj(s[3]);if(!p)return;gLab.append('text').datum(s[4]).attr('x',p[0]).attr('y',p[1]).attr('text-anchor','middle').attr('dominant-baseline','middle').style('fill','var(--text-primary)').style('stroke','var(--surface-1)').style('paint-order','stroke').style('font-weight',s[4]?500:400).text(s[1])});
relabel();
}).catch(()=>{document.getElementById('info').textContent='Nie udało się wczytać konturów mapy.'});
function relabel(){gLab.selectAll('text').style('font-size',(11/k)+'px').style('stroke-width',(2.5/k)+'px').style('display',function(d){return(d||k>=2)?null:'none'})}
const zoom=d3.zoom().scaleExtent([1,12]).translateExtent([[0,0],[Wd,Ht]]).on('zoom',e=>{k=e.transform.k;root.attr('transform',e.transform);relabel()});
svg.call(zoom).on('click',()=>{if(sel)pick(sel)});
document.getElementById('zin').onclick=()=>svg.transition().duration(250).call(zoom.scaleBy,1.6);
document.getElementById('zout').onclick=()=>svg.transition().duration(250).call(zoom.scaleBy,1/1.6);
document.getElementById('zres').onclick=()=>svg.transition().duration(300).call(zoom.transform,d3.zoomIdentity);
const lg=document.getElementById('legend');
G.forEach(([t,keys])=>{const h=document.createElement('div');h.style.cssText='grid-column:1/-1;font-size:12px;color:var(--text-muted);margin:10px 0 4px';h.textContent=t;lg.appendChild(h);keys.forEach(key=>{const d=document.createElement('div');d.className='lg';d.dataset.k=key;d.innerHTML=`<span class="sw" style="background:${S[key][2]}"></span>${S[key][1]||'Ziemie tubylcze'}`;d.onclick=()=>pick(key);lg.appendChild(d)})});
</script>

</body></html>
